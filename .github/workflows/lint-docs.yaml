name: Lint

on:
  push:
    branches:
      - "main"
  workflow_call:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - "main"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # `uv run` would otherwise re-sync the venv without the `deepagents` extra installed below.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project
        # The `deepagents` extra needs Python >= 3.11 (see pyproject.toml).
        run: |
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            uv sync --dev
          else
            uv sync --dev --extra deepagents
          fi
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Typecheck
        # On 3.10 the DeepAgents harness and its tests can't be type-checked, because the extra isn't installed.
        run: |
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            uv run pyright -p pyrightconfig.py310.json
          else
            uv run pyright
          fi
      - name: Format
        run: uv run ruff format
      - name: Test
        run: uv run pytest tests
