<title>AgentDojo Security Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: instrument-panel dashboard. Sticky control bar, summary strip, pipeline overview, then one
   user-task x injection-task grid per suite, each scrolling sideways in its own box; a run opens in a side drawer. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --sunken: #e7ebf0;
  --ink: #17202b;
  --muted: #586474;
  --line: #d3dae3;
  --accent: #2a45c2;
  --accent-ink: #ffffff;
  --breach: #c63a2e;
  --defend: #1b7a4b;
  --amber: #b06d08;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --cell: 70px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d26; --sunken: #1d2631; --ink: #e3e8ee; --muted: #98a4b3; --line: #2a3542;
    --accent: #8fa3ff; --accent-ink: #0e131a; --breach: #ff7b6c; --defend: #4fc58c; --amber: #e6a84a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d26; --sunken: #1d2631; --ink: #e3e8ee; --muted: #98a4b3; --line: #2a3542;
  --accent: #8fa3ff; --accent-ink: #0e131a; --breach: #ff7b6c; --defend: #4fc58c; --amber: #e6a84a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 1400px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
#app { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
#app > section.suite { margin-top: 12px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 85%; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Header */
header.top { display: flex; flex-direction: column; gap: 6px; padding-block: 28px 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 10px 14px; color: var(--muted); font-size: 14px; }

/* Control bar */
.controls {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: end; gap: 12px 16px;
  padding: 12px 14px; margin-inline: -14px;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: min(320px, 100%); min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; gap: 2px; max-width: 100%; }
.seg button {
  border: 0; background: transparent; border-radius: 5px; padding: 6px 12px; cursor: pointer;
  font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22ch; min-width: 0;
}
.seg button .tag { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; margin-right: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:not([aria-pressed="true"]):hover { background: var(--sunken); }
.check { display: inline-flex; align-items: center; gap: 8px; padding-block: 6px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .label { font-size: 12px; color: var(--muted); }
.stat .value { font-family: var(--font-display); font-stretch: 85%; font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat.good .value { color: var(--defend); }
.stat.bad .value { color: var(--breach); }
.stat.warn .value { color: var(--amber); }
.context { font-size: 14px; color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); align-items: center; }
.legend .sw { display: inline-grid; place-items: center; width: 34px; height: 22px; border-radius: 4px; margin-right: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--ink); vertical-align: middle; }

/* Overview */
details.overview { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
details.overview > summary { cursor: pointer; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; list-style: none; }
details.overview > summary::-webkit-details-marker { display: none; }
details.overview > summary::before { content: "▸"; color: var(--muted); }
details.overview[open] > summary::before { content: "▾"; }
.scroll { overflow-x: auto; min-width: 0; }
table.ov { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.ov th, table.ov td { padding: 7px 12px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
table.ov th:first-child, table.ov td:first-child { text-align: left; }
table.ov thead th { border-top: 0; font-weight: 600; font-size: 12px; color: var(--muted); }
table.ov thead button { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; color: inherit; }
table.ov thead button[aria-sort] { color: var(--ink); }
table.ov tr.sel-a td:first-child, table.ov tr.sel-b td:first-child { font-weight: 600; }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 8px; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 1px 8px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bar { display: inline-block; width: 56px; height: 6px; border-radius: 3px; background: var(--sunken); vertical-align: middle; margin-left: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--breach); }

/* Suite grids */
section.suite { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.suite-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.suite-head h2 { text-transform: capitalize; }
details.unrun > summary { cursor: pointer; color: var(--muted); font-size: 14px; padding-block: 4px; }
details.unrun[open] > summary { margin-bottom: 8px; }
.gridbox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-width: 0; }
table.grid { border-collapse: separate; border-spacing: 3px; font-variant-numeric: tabular-nums; }
table.grid th { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--muted); white-space: nowrap; }
table.grid thead th { height: 30px; min-width: var(--cell); cursor: help; }
table.grid th.rh { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding-inline: 4px 10px; cursor: help; }
table.grid th.corner { position: sticky; left: 0; z-index: 2; background: var(--surface); cursor: default; }
td.c, td.m {
  width: var(--cell); min-width: var(--cell); height: 44px; border-radius: 4px; text-align: center; vertical-align: middle;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.15; padding: 2px;
}
td.c { cursor: pointer; }
td.c:hover { box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--ink) 35%, transparent); }
td.c:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
td.c small, td.m small { display: block; font-size: 10.5px; color: var(--muted); }
td.c b { font-weight: 600; }
.s-none { background: var(--sunken); color: var(--muted); }
.s-def { background: color-mix(in oklab, var(--defend) 20%, var(--surface)); }
.s-br { background: color-mix(in oklab, var(--breach) var(--p, 40%), var(--surface)); }
.s-full { background: color-mix(in oklab, var(--breach) 62%, var(--surface)); }
.s-full b { font-weight: 700; }
.s-fix { background: color-mix(in oklab, var(--defend) 32%, var(--surface)); }
.s-reg { background: color-mix(in oklab, var(--breach) 42%, var(--surface)); }
.s-mix { background: color-mix(in oklab, var(--amber) 30%, var(--surface)); }
.s-same { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
small.ob { color: var(--amber) !important; font-weight: 600; }
td.m { background: var(--sunken); }
td.m.total { background: color-mix(in oklab, var(--accent) 14%, var(--surface)); font-weight: 600; }
tr.margin th.rh { font-weight: 600; }
.d-good { color: var(--defend); font-weight: 600; }
.d-bad { color: var(--breach); font-weight: 600; }

/* Detail drawer */
dialog#detail {
  margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(680px, 100%); max-width: 100%;
  border: 0; border-left: 1px solid var(--line); padding: 0; background: var(--surface); color: var(--ink);
}
dialog#detail.wide { width: min(1120px, 100%); }
dialog#detail::backdrop { background: color-mix(in oklab, #000 40%, transparent); }
.d-head {
  position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px; display: flex; gap: 12px; align-items: start; justify-content: space-between;
}
.d-head button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.d-body { padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.task-text { display: grid; grid-template-columns: 4.5em 1fr; gap: 6px 12px; font-size: 14px; }
.task-text dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.task-text dd { margin: 0; overflow-wrap: anywhere; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col h3 { overflow-wrap: anywhere; }
.run { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.run.br { border-left: 4px solid var(--breach); }
.run.df { border-left: 4px solid var(--defend); }
.run-head { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.run-head code { font-weight: 600; margin-right: auto; overflow-wrap: anywhere; }
.pill { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.br { background: color-mix(in oklab, var(--breach) 18%, var(--surface)); color: var(--breach); }
.pill.df { background: color-mix(in oklab, var(--defend) 18%, var(--surface)); color: var(--defend); }
.pill.ok { background: var(--sunken); color: var(--ink); }
.pill.fail { background: color-mix(in oklab, var(--amber) 18%, var(--surface)); color: var(--amber); }
.trace { margin: 0; padding-left: 22px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.trace li { overflow-wrap: anywhere; }
.dets { margin: 0; padding-left: 18px; font-size: 13px; }
.dets li { overflow-wrap: anywhere; }
.benign { font-size: 13px; color: var(--muted); }

/* Empty state & footer */
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px; max-width: 72ch; }
.empty pre { margin: 0; background: var(--sunken); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
footer.defs { border-top: 1px solid var(--line); padding-top: 18px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; max-width: 90ch; }
footer.defs dl { display: grid; grid-template-columns: minmax(8em, max-content) 1fr; gap: 6px 16px; margin: 0; }
footer.defs dt { color: var(--ink); font-weight: 600; }
footer.defs dd { margin: 0; }
@media (max-width: 560px) {
  footer.defs dl, .task-text { grid-template-columns: 1fr; }
  .stat .value { font-size: 1.4rem; }
}
</style>

<script id="grid-data" type="application/json">/*__GRID_DATA__*/null</script>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">AgentDojo · prompt-injection results</div>
    <h1>Security Grid</h1>
    <p class="muted" id="meta">Every user task × injection task pair, with attack success rate per cell, row, column and suite.</p>
  </header>
  <div id="app"></div>
</div>

<dialog id="detail" aria-labelledby="detail-title">
  <div class="d-head">
    <div>
      <div class="eyebrow" id="detail-eyebrow"></div>
      <h2 id="detail-title"></h2>
    </div>
    <button type="button" id="detail-close">Close</button>
  </div>
  <div class="d-body" id="detail-body"></div>
</dialog>

<script>
(() => {
  "use strict";

  const KIND_LABEL = {
    static_guardrail: "static guardrail",
    evolving_guardrail: "evolving guardrail",
    group: "pooled",
    defense: "defense",
    model: "no defense",
  };
  const KIND_ORDER = ["static_guardrail", "evolving_guardrail", "group", "defense", "model"];
  const STORE_KEY = "agentdojo-security-grid";

  let D = null;
  let arms = [];
  let state = null;
  const app = document.getElementById("app");

  const esc = (value) =>
    String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pct = (k, n) => (n ? ((100 * k) / n).toFixed(1) + "%" : "—");
  const frac = (k, n) => (n ? `${pct(k, n)} · ${k}/${n}` : "no runs");
  const shortId = (id) => id.replace(/^user_task_/, "UT ").replace(/^injection_task_/, "IT ");
  const signed = (x) => (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x).toFixed(1);

  /* ---------- data ---------- */

  function prepare() {
    D.suiteIdx = new Map(D.suites.map((s, i) => [s, i]));
    D.idPos = {};
    for (const [suite, ids] of Object.entries(D.ids)) D.idPos[suite] = new Map(ids.map((id, i) => [id, i]));
    const byName = new Map();
    D.pipelines.forEach((p, i) => {
      byName.set(p.name, i);
      p.index = new Map();
      p.attacks = new Set();
      for (const r of p.runs) {
        const key = r[0] + "|" + r[1] + "|" + r[2];
        let list = p.index.get(key);
        if (!list) p.index.set(key, (list = []));
        list.push(r);
        p.attacks.add(r[3]);
      }
      p.benignIdx = new Map(p.benign.map((b) => [b[0] + "|" + b[1], b]));
    });
    arms = D.pipelines.map((p, i) => ({ key: "p:" + p.name, label: p.name, kind: p.kind, members: [i] }));
    for (const g of D.groups || []) {
      arms.push({ key: "g:" + g.name, label: g.name, kind: "group", members: g.members.map((n) => byName.get(n)) });
    }
    for (const a of arms) {
      a.attacks = new Set();
      a.versions = new Set();
      a.runCount = 0;
      for (const m of a.members) {
        const p = D.pipelines[m];
        p.attacks.forEach((x) => a.attacks.add(x));
        a.versions.add(p.version);
        a.runCount += p.runs.length;
      }
    }
  }

  const armByKey = (key) => arms.find((a) => a.key === key);

  function defaultState() {
    const live = arms.filter((a) => a.runCount > 0);
    const pool = live.length ? live : arms;
    const stat = pool.find((a) => a.kind === "static_guardrail");
    const evo =
      pool.find((a) => a.kind === "group" && a.members.every((m) => D.pipelines[m].kind === "evolving_guardrail")) ||
      pool.filter((a) => a.kind === "evolving_guardrail").slice(-1)[0];
    let a, b;
    if (stat && evo) {
      a = stat;
      b = evo;
    } else {
      a = pool.reduce((best, x) => (x.attacks.size > best.attacks.size ? x : best), pool[0]);
      b = pool.find((x) => x !== a && x.label.startsWith(a.label + "-")) || pool.find((x) => x !== a) || a;
    }
    return { a: a.key, b: b.key, view: "a", attack: "*", suite: "*", hide: false, sort: { key: "kind", dir: 1 } };
  }

  function loadState() {
    const base = defaultState();
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (saved && armByKey(saved.a) && armByKey(saved.b)) Object.assign(base, saved);
    } catch (e) {
      /* storage unavailable: use defaults */
    }
    return base;
  }

  function saveState() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      /* ignore */
    }
  }

  function viewArms() {
    const A = armByKey(state.a);
    const B = armByKey(state.b);
    if (state.view === "compare") return [A, B];
    return [state.view === "b" ? B : A];
  }

  function attackSet(list) {
    if (state.attack !== "*") return new Set([Number(state.attack)]);
    if (list.length === 1) return list[0].attacks;
    return new Set([...list[0].attacks].filter((x) => list[1].attacks.has(x)));
  }

  function versionsOf(list) {
    const out = [];
    for (const a of list) for (const v of a.versions) if (!out.includes(v)) out.push(v);
    return out;
  }

  function gridFor(list, suiteFilter) {
    const suites = new Map();
    for (const v of versionsOf(list)) {
      for (const [name, g] of Object.entries(D.versions[v].suites)) {
        let entry = suites.get(name);
        if (!entry) suites.set(name, (entry = { u: new Set(), i: new Set() }));
        g.user_tasks.forEach((x) => entry.u.add(x));
        g.injection_tasks.forEach((x) => entry.i.add(x));
      }
    }
    const out = [];
    for (const [name, entry] of suites) {
      if (suiteFilter !== "*" && suiteFilter !== name) continue;
      const pos = D.idPos[name];
      const order = (ids) => [...ids].sort((x, y) => pos.get(x) - pos.get(y)).map((id) => ({ id, p: pos.get(id) }));
      out.push({ name, s: D.suiteIdx.has(name) ? D.suiteIdx.get(name) : -1, uts: order(entry.u), its: order(entry.i) });
    }
    return out;
  }

  function taskText(kind, suite, id, versions) {
    for (const v of versions) {
      const g = D.versions[v] && D.versions[v].suites[suite];
      const t = g && (kind === "prompt" ? g.prompts : g.goals)[id];
      if (t) return t;
    }
    return "";
  }

  function runsFor(arm, s, u, i, atk) {
    const out = [];
    if (s < 0) return out;
    const key = s + "|" + u + "|" + i;
    for (const m of arm.members) {
      const list = D.pipelines[m].index.get(key);
      if (list) for (const r of list) if (atk.has(r[3])) out.push({ r, m });
    }
    return out;
  }

  const blank = () => ({ n: 0, k: 0, u: 0 });
  function add(t, r) {
    t.n += 1;
    t.k += r[5];
    t.u += r[4];
  }
  function merge(t, o) {
    t.n += o.n;
    t.k += o.k;
    t.u += o.u;
  }

  /* Single arm: tally the runs of one cell. */
  function singleCell(arm, s, u, i, atk, members) {
    const t = blank();
    t.over = 0;
    for (const { r, m } of runsFor(arm, s, u, i, atk)) {
      add(t, r);
      if (!r[5] && !r[4]) t.over += 1;
      if (members) {
        if (!members.has(m)) members.set(m, blank());
        add(members.get(m), r);
      }
    }
    return t;
  }

  /* Compare: per attack, compare A's and B's breach rate on this pair; only attacks both arms ran count. */
  function compareCell(A, B, s, u, i, atk, members) {
    const per = (arm) => {
      const map = new Map();
      for (const { r, m } of runsFor(arm, s, u, i, atk)) {
        if (!map.has(r[3])) map.set(r[3], { t: blank(), runs: [] });
        const e = map.get(r[3]);
        add(e.t, r);
        e.runs.push({ r, m });
      }
      return map;
    };
    const a = per(A);
    const b = per(B);
    const c = { fixed: 0, reg: 0, same: 0, A: blank(), B: blank(), any: a.size + b.size };
    for (const [attack, ea] of a) {
      const eb = b.get(attack);
      if (!eb) continue;
      const ra = ea.t.k / ea.t.n;
      const rb = eb.t.k / eb.t.n;
      if (rb < ra) c.fixed += 1;
      else if (rb > ra) c.reg += 1;
      else c.same += 1;
      merge(c.A, ea.t);
      merge(c.B, eb.t);
      if (members) {
        for (const [side, e] of [["A", ea], ["B", eb]]) {
          for (const { r, m } of e.runs) {
            const key = side + m;
            if (!members.has(key)) members.set(key, blank());
            add(members.get(key), r);
          }
        }
      }
    }
    return c;
  }

  function meanStd(values) {
    const n = values.length;
    const mean = values.reduce((x, y) => x + y, 0) / n;
    const sd = n > 1 ? Math.sqrt(values.reduce((x, y) => x + (y - mean) ** 2, 0) / (n - 1)) : 0;
    return { mean, sd, n };
  }

  /* ---------- controls ---------- */

  function armOptions(selected) {
    const groups = new Map();
    for (const a of arms) {
      if (!groups.has(a.kind)) groups.set(a.kind, []);
      groups.get(a.kind).push(a);
    }
    let html = "";
    for (const kind of KIND_ORDER) {
      const list = groups.get(kind);
      if (!list) continue;
      html += `<optgroup label="${esc(KIND_LABEL[kind])}">`;
      for (const a of list) {
        const note = a.runCount ? "" : " (no attack runs)";
        html += `<option value="${esc(a.key)}"${a.key === selected ? " selected" : ""}>${esc(a.label + note)}</option>`;
      }
      html += "</optgroup>";
    }
    return html;
  }

  function attackOptions() {
    const A = armByKey(state.a);
    const B = armByKey(state.b);
    const all = [...new Set([...A.attacks, ...B.attacks])].sort((x, y) => D.attacks[x].localeCompare(D.attacks[y]));
    let html = `<option value="*">All attacks</option>`;
    for (const x of all) {
      const where = A.attacks.has(x) && B.attacks.has(x) ? "" : A.attacks.has(x) ? " · A only" : " · B only";
      html += `<option value="${x}"${String(x) === String(state.attack) ? " selected" : ""}>${esc(D.attacks[x] + where)}</option>`;
    }
    return html;
  }

  function suiteOptions() {
    const names = [];
    for (const v of Object.values(D.versions)) for (const s of Object.keys(v.suites)) if (!names.includes(s)) names.push(s);
    return (
      `<option value="*">All suites</option>` +
      names.map((s) => `<option value="${esc(s)}"${s === state.suite ? " selected" : ""}>${esc(s)}</option>`).join("")
    );
  }

  function controlsHtml() {
    const A = armByKey(state.a);
    const B = armByKey(state.b);
    const seg = (view, tag, label) =>
      `<button type="button" data-view="${view}" aria-pressed="${state.view === view}" title="${esc(label)}">` +
      (tag ? `<span class="tag">${tag}</span>` : "") +
      `${esc(label)}</button>`;
    return `
      <div class="controls" role="toolbar" aria-label="Grid controls">
        <div class="field"><span>View</span>
          <div class="seg">${seg("a", "A", A.label)}${seg("b", "B", B.label)}${seg("compare", "", "Compare A → B")}</div>
        </div>
        <label class="field" for="sel-a"><span>A</span><select id="sel-a">${armOptions(state.a)}</select></label>
        <label class="field" for="sel-b"><span>B</span><select id="sel-b">${armOptions(state.b)}</select></label>
        <label class="field" for="sel-attack"><span>Attack</span><select id="sel-attack">${attackOptions()}</select></label>
        <label class="field" for="sel-suite"><span>Suite</span><select id="sel-suite">${suiteOptions()}</select></label>
        <label class="check" for="chk-hide"><input type="checkbox" id="chk-hide"${state.hide ? " checked" : ""}>Hide tasks with no results</label>
      </div>`;
  }

  function bindControls() {
    app.querySelectorAll(".seg button").forEach((btn) =>
      btn.addEventListener("click", () => update({ view: btn.dataset.view })),
    );
    app.querySelector("#sel-a").addEventListener("change", (e) => update({ a: e.target.value }));
    app.querySelector("#sel-b").addEventListener("change", (e) => update({ b: e.target.value }));
    app.querySelector("#sel-attack").addEventListener("change", (e) => update({ attack: e.target.value }));
    app.querySelector("#sel-suite").addEventListener("change", (e) => update({ suite: e.target.value }));
    app.querySelector("#chk-hide").addEventListener("change", (e) => update({ hide: e.target.checked }));
    app.querySelectorAll("[data-pick]").forEach((btn) =>
      btn.addEventListener("click", () => {
        const [slot, key] = [btn.dataset.pick, btn.dataset.key];
        update({ [slot]: key, view: state.view === "compare" ? "compare" : slot });
      }),
    );
    app.querySelectorAll("[data-sort]").forEach((btn) =>
      btn.addEventListener("click", () => {
        const key = btn.dataset.sort;
        const dir = state.sort.key === key ? -state.sort.dir : key === "kind" ? 1 : -1;
        update({ sort: { key, dir } });
      }),
    );
  }

  function update(patch) {
    const focusId = document.activeElement && document.activeElement.id;
    Object.assign(state, patch);
    const A = armByKey(state.a);
    const B = armByKey(state.b);
    if (state.attack !== "*" && !A.attacks.has(Number(state.attack)) && !B.attacks.has(Number(state.attack))) {
      state.attack = "*";
    }
    saveState();
    render();
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) el.focus();
    }
  }

  /* ---------- rendering ---------- */

  function render() {
    const list = viewArms();
    const atk = attackSet(list);
    const grid = gridFor(list, state.suite);
    const versions = versionsOf(list);
    const compare = state.view === "compare";

    const totals = compare ? { A: blank(), B: blank(), fixed: 0, reg: 0, same: 0 } : Object.assign(blank(), { over: 0 });
    const members = new Map();
    let pairs = 0;
    let covered = 0;
    const suiteHtml = [];

    for (const suite of grid) {
      const cells = suite.uts.map((ut) =>
        suite.its.map((it) =>
          compare
            ? compareCell(list[0], list[1], suite.s, ut.p, it.p, atk, members)
            : singleCell(list[0], suite.s, ut.p, it.p, atk, members),
        ),
      );
      const has = (c) => (compare ? c.A.n > 0 && c.B.n > 0 : c.n > 0);
      const shown = (c) => (compare ? c.any > 0 : c.n > 0);
      const anyRuns = cells.some((row) => row.some(shown));
      let rows = suite.uts.map((_, r) => r);
      let cols = suite.its.map((_, c) => c);
      if (state.hide) {
        rows = rows.filter((r) => cells[r].some(shown));
        cols = cols.filter((c) => cells.some((row) => shown(row[c])));
      }
      pairs += suite.uts.length * suite.its.length;
      let suiteCovered = 0;
      cells.forEach((row) => row.forEach((c) => (suiteCovered += has(c) ? 1 : 0)));
      covered += suiteCovered;

      const suiteTotal = compare ? { A: blank(), B: blank(), fixed: 0, reg: 0, same: 0 } : Object.assign(blank(), { over: 0 });
      const colTotals = suite.its.map(() => (compare ? { A: blank(), B: blank() } : blank()));
      let body = "";
      for (const r of rows) {
        const ut = suite.uts[r];
        const rowTotal = compare ? { A: blank(), B: blank() } : blank();
        let tds = "";
        for (const c of cols) {
          const cell = cells[r][c];
          const it = suite.its[c];
          tds += compare ? compareTd(cell, suite, ut, it) : singleTd(cell, suite, ut, it);
        }
        cells[r].forEach((cell, c) => {
          if (compare) {
            merge(rowTotal.A, cell.A);
            merge(rowTotal.B, cell.B);
            merge(colTotals[c].A, cell.A);
            merge(colTotals[c].B, cell.B);
            merge(suiteTotal.A, cell.A);
            merge(suiteTotal.B, cell.B);
            suiteTotal.fixed += cell.fixed;
            suiteTotal.reg += cell.reg;
            suiteTotal.same += cell.same;
          } else {
            merge(rowTotal, cell);
            merge(colTotals[c], cell);
            merge(suiteTotal, cell);
            suiteTotal.over += cell.over;
          }
        });
        const prompt = taskText("prompt", suite.name, ut.id, versions);
        body += `<tr><th class="rh" scope="row" title="${esc(prompt)}">${esc(shortId(ut.id))}</th>${tds}${marginTd(rowTotal, compare)}</tr>`;
      }
      // Rows hidden by "hide empty" still count toward margins, so add the hidden ones.
      for (let r = 0; r < suite.uts.length; r++) {
        if (rows.includes(r)) continue;
        cells[r].forEach((cell, c) => {
          if (compare) {
            merge(colTotals[c].A, cell.A);
            merge(colTotals[c].B, cell.B);
            merge(suiteTotal.A, cell.A);
            merge(suiteTotal.B, cell.B);
          } else {
            merge(colTotals[c], cell);
            merge(suiteTotal, cell);
          }
        });
      }
      if (compare) {
        merge(totals.A, suiteTotal.A);
        merge(totals.B, suiteTotal.B);
        totals.fixed += suiteTotal.fixed;
        totals.reg += suiteTotal.reg;
        totals.same += suiteTotal.same;
      } else {
        merge(totals, suiteTotal);
        totals.over += suiteTotal.over;
      }

      const head = cols
        .map((c) => {
          const it = suite.its[c];
          return `<th scope="col" title="${esc(taskText("goal", suite.name, it.id, versions))}">${esc(shortId(it.id))}</th>`;
        })
        .join("");
      const foot = cols.map((c) => marginTd(colTotals[c], compare)).join("");
      const asrLine = compare
        ? `A ${frac(suiteTotal.A.k, suiteTotal.A.n)} → B ${frac(suiteTotal.B.k, suiteTotal.B.n)}`
        : `ASR ${frac(suiteTotal.k, suiteTotal.n)}`;
      suiteHtml.push(`
        <section class="suite" aria-labelledby="suite-${esc(suite.name)}">
          <div class="suite-head">
            <h2 id="suite-${esc(suite.name)}">${esc(suite.name)}</h2>
            <span class="muted num">${suite.uts.length} user × ${suite.its.length} injection tasks = ${suite.uts.length * suite.its.length} pairs · ${suiteCovered} run</span>
            <span class="num">${asrLine}</span>
          </div>
          ${anyRuns ? "" : `<details class="unrun"><summary>No results in this suite yet. Show its ${suite.uts.length * suite.its.length} empty pairs</summary>`}
          <div class="gridbox">
            <table class="grid" data-suite="${esc(suite.name)}" data-s="${suite.s}">
              <thead><tr><th class="corner"></th>${head}<th scope="col" title="ASR across this user task's row">row</th></tr></thead>
              <tbody>${body}
                <tr class="margin"><th class="rh" scope="row" title="ASR down each injection task's column">column</th>${foot}${marginTd(suiteTotal, compare, true)}</tr>
              </tbody>
            </table>
          </div>${anyRuns ? "" : "</details>"}
        </section>`);
    }

    app.innerHTML =
      controlsHtml() +
      summaryHtml(list, atk, totals, members, pairs, covered, versions) +
      legendHtml(compare) +
      overviewHtml() +
      suiteHtml.join("") +
      footerHtml();
    bindControls();
  }

  function singleTd(t, suite, ut, it) {
    const attrs = `tabindex="0" role="button" data-u="${ut.p}" data-i="${it.p}"`;
    const name = `${shortId(ut.id)} × ${shortId(it.id)}`;
    if (!t.n) return `<td class="c s-none" ${attrs} aria-label="${name}: not run">·</td>`;
    let cls;
    let main;
    if (t.k === 0) {
      cls = "s-def";
      main = t.n === 1 ? "✓" : `0/${t.n}`;
    } else if (t.k === t.n) {
      cls = "s-full";
      main = t.n === 1 ? "✗" : `${t.k}/${t.n}`;
    } else {
      cls = "s-br";
      main = `${t.k}/${t.n}`;
    }
    const p = Math.round(18 + (40 * t.k) / t.n);
    const style = cls === "s-br" ? ` style="--p:${p}%"` : "";
    const over = t.k === 0 && t.u < t.n;
    const util = `<small${over ? ' class="ob"' : ""}>U ${t.u}/${t.n}</small>`;
    const label = `${name}: attack succeeded in ${t.k} of ${t.n} runs, task done in ${t.u}`;
    return `<td class="c ${cls}"${style} ${attrs} aria-label="${label}"><b>${main}</b>${util}</td>`;
  }

  function compareTd(c, suite, ut, it) {
    const attrs = `tabindex="0" role="button" data-u="${ut.p}" data-i="${it.p}"`;
    const name = `${shortId(ut.id)} × ${shortId(it.id)}`;
    if (!c.A.n) {
      const why = c.any ? "only one side ran" : "not run";
      return `<td class="c s-none" ${attrs} aria-label="${name}: ${why}">·${c.any ? "<small>one side</small>" : ""}</td>`;
    }
    let cls;
    let main;
    let word;
    if (c.fixed && c.reg) {
      cls = "s-mix";
      main = `▲${c.fixed} ▼${c.reg}`;
      word = "mixed";
    } else if (c.fixed) {
      cls = "s-fix";
      main = c.fixed > 1 ? `▲ ${c.fixed}` : "▲";
      word = "fixed";
    } else if (c.reg) {
      cls = "s-reg";
      main = c.reg > 1 ? `▼ ${c.reg}` : "▼";
      word = "regressed";
    } else {
      cls = "s-same";
      main = "=";
      word = "same";
    }
    const label = `${name}: ${word}; attacker succeeded ${c.A.k} of ${c.A.n} in A and ${c.B.k} of ${c.B.n} in B`;
    return `<td class="c ${cls}" ${attrs} aria-label="${label}"><b>${main}</b><small>${c.A.k}→${c.B.k}</small></td>`;
  }

  function marginTd(t, compare, total) {
    const cls = total ? "m total" : "m";
    if (compare) {
      if (!t.A.n) return `<td class="${cls}">—</td>`;
      const d = (100 * t.B.k) / t.B.n - (100 * t.A.k) / t.A.n;
      const dc = d < 0 ? "d-good" : d > 0 ? "d-bad" : "";
      return `<td class="${cls}" title="A ${frac(t.A.k, t.A.n)} · B ${frac(t.B.k, t.B.n)}"><span class="${dc}">${signed(d)}</span><small>pts</small></td>`;
    }
    if (!t.n) return `<td class="${cls}">—</td>`;
    return `<td class="${cls}" title="${frac(t.k, t.n)}">${pct(t.k, t.n)}<small>${t.k}/${t.n}</small></td>`;
  }

  function stat(label, value, sub, tone) {
    return `<div class="stat${tone ? " " + tone : ""}"><span class="label">${esc(label)}</span><span class="value">${value}</span><span class="sub">${sub}</span></div>`;
  }

  function memberSpread(arm, members, prefix) {
    if (arm.members.length < 2) return "";
    const values = [];
    for (const m of arm.members) {
      const t = members.get(prefix + m);
      if (t && t.n) values.push((100 * t.k) / t.n);
    }
    if (values.length < 2) return "";
    const { mean, sd, n } = meanStd(values);
    return ` · per-member ${mean.toFixed(1)}% ± ${sd.toFixed(1)} (n=${n})`;
  }

  function benignTally(arm, suiteFilter) {
    const t = blank();
    for (const m of arm.members) {
      for (const b of D.pipelines[m].benign) {
        if (suiteFilter !== "*" && D.suites[b[0]] !== suiteFilter) continue;
        t.n += 1;
        t.u += b[2];
      }
    }
    return t;
  }

  function summaryHtml(list, atk, totals, members, pairs, covered, versions) {
    const attackNote =
      state.attack !== "*"
        ? `attack <code>${esc(D.attacks[Number(state.attack)])}</code>`
        : list.length === 2
          ? `the ${atk.size} attack${atk.size === 1 ? "" : "s"} both A and B ran`
          : `all ${atk.size} attack${atk.size === 1 ? "" : "s"}`;
    const scope = `${state.suite === "*" ? "all suites" : esc(state.suite)} · ${attackNote} · task set ${esc(versions.join(", "))}`;
    let tiles;
    if (list.length === 2) {
      const [A, B] = list;
      const d = totals.A.n && totals.B.n ? (100 * totals.B.k) / totals.B.n - (100 * totals.A.k) / totals.A.n : 0;
      tiles = [
        stat("Pairs both ran", `${covered}<span class="muted"> / ${pairs}</span>`, `${pct(covered, pairs)} of the grid`),
        stat("ASR · A", pct(totals.A.k, totals.A.n), `${totals.A.k}/${totals.A.n}${memberSpread(A, members, "A")}`),
        stat("ASR · B", pct(totals.B.k, totals.B.n), `${totals.B.k}/${totals.B.n}${memberSpread(B, members, "B")}`),
        stat("Change B − A", `${signed(d)} pts`, "negative means B lets fewer attacks through", d < 0 ? "good" : d > 0 ? "bad" : ""),
        stat("Fixed in B", String(totals.fixed), "pair × attack cases where B's breach rate is lower", totals.fixed ? "good" : ""),
        stat("Regressed in B", String(totals.reg), `higher in B · ${totals.same} unchanged`, totals.reg ? "bad" : ""),
        stat(
          "Utility under attack",
          `${pct(totals.A.u, totals.A.n)} → ${pct(totals.B.u, totals.B.n)}`,
          `A ${totals.A.u}/${totals.A.n} · B ${totals.B.u}/${totals.B.n}`,
        ),
      ];
    } else {
      const [A] = list;
      const benign = benignTally(A, state.suite);
      tiles = [
        stat("Pairs run", `${covered}<span class="muted"> / ${pairs}</span>`, `coverage ${pct(covered, pairs)}`),
        stat("Attack success rate", pct(totals.k, totals.n), `${totals.k}/${totals.n} runs${memberSpread(A, members, "")}`, totals.k ? "bad" : "good"),
        stat("Utility under attack", pct(totals.u, totals.n), `${totals.u}/${totals.n} runs finished the user's task`),
        stat("Benign utility", pct(benign.u, benign.n), benign.n ? `${benign.u}/${benign.n} tasks without an attack` : "no runs without an attack"),
        stat("Defended, task failed", String(totals.over), "runs where the attack failed and so did the task", totals.over ? "warn" : ""),
        stat("Attack runs", String(totals.n), `${A.members.length > 1 ? A.members.length + " pipelines pooled" : esc(KIND_LABEL[A.kind])}`),
      ];
    }
    return `<div class="summary" aria-live="polite">${tiles.join("")}</div><p class="context">${scope}</p>`;
  }

  function legendHtml(compare) {
    const sw = (cls, text, style) => `<span><span class="sw ${cls}"${style ? ` style="${style}"` : ""}>${text}</span>`;
    if (compare) {
      return `<div class="legend">
        ${sw("s-fix", "▲")}fixed: B lets fewer attacks through</span>
        ${sw("s-reg", "▼")}regressed: B lets more through</span>
        ${sw("s-mix", "▲▼")}some attacks fixed, some regressed</span>
        ${sw("s-same", "=")}unchanged</span>
        ${sw("s-none", "·")}not run by both</span>
        <span>small text: breached runs A→B · margins: ASR change in points</span>
      </div>`;
    }
    return `<div class="legend">
      ${sw("s-def", "✓")}defended</span>
      ${sw("s-br", "k/n", "--p:38%")}partly breached</span>
      ${sw("s-full", "✗")}fully breached</span>
      ${sw("s-none", "·")}not run</span>
      <span><b class="mono">k/n</b> attacks that succeeded · <span class="mono">U</span> runs that finished the task (<span class="mono" style="color:var(--amber);font-weight:600">amber</span> = defended but the task failed)</span>
    </div>`;
  }

  function overviewHtml() {
    const atk = state.attack !== "*" ? Number(state.attack) : null;
    const rows = arms.map((a) => {
      const t = blank();
      const pairsSeen = new Set();
      for (const m of a.members) {
        for (const r of D.pipelines[m].runs) {
          if (state.suite !== "*" && D.suites[r[0]] !== state.suite) continue;
          if (atk !== null && r[3] !== atk) continue;
          add(t, r);
          pairsSeen.add(r[0] + "|" + r[1] + "|" + r[2]);
        }
      }
      const gridPairs = gridFor([a], state.suite).reduce((n, s) => n + s.uts.length * s.its.length, 0);
      const benign = benignTally(a, state.suite);
      return {
        a,
        t,
        asr: t.n ? t.k / t.n : -1,
        util: t.n ? t.u / t.n : -1,
        benign: benign.n ? benign.u / benign.n : -1,
        benignT: benign,
        cov: gridPairs ? pairsSeen.size / gridPairs : 0,
        covText: `${pairsSeen.size}/${gridPairs}`,
      };
    });
    const { key, dir } = state.sort;
    const kindRank = (a) => KIND_ORDER.indexOf(a.kind);
    rows.sort((x, y) => {
      if (key === "kind") return dir * (kindRank(x.a) - kindRank(y.a) || x.a.label.localeCompare(y.a.label));
      if (key === "name") return dir * x.a.label.localeCompare(y.a.label);
      return dir * (x[key] - y[key]) || x.a.label.localeCompare(y.a.label);
    });
    const th = (k, label) =>
      `<th scope="col"><button type="button" data-sort="${k}"${key === k ? ` aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""}>${label}${key === k ? (dir > 0 ? " ↑" : " ↓") : ""}</button></th>`;
    const body = rows
      .map((x) => {
        const sel = (x.a.key === state.a ? " sel-a" : "") + (x.a.key === state.b ? " sel-b" : "");
        const asr = x.t.n
          ? `${pct(x.t.k, x.t.n)} <span class="muted">${x.t.k}/${x.t.n}</span><span class="bar" aria-hidden="true"><i style="width:${(100 * x.asr).toFixed(1)}%"></i></span>`
          : "—";
        return `<tr class="${sel.trim()}">
          <td>${esc(x.a.label)}<span class="chip">${esc(KIND_LABEL[x.a.kind])}</span></td>
          <td>${x.a.attacks.size}</td>
          <td>${asr}</td>
          <td>${x.t.n ? pct(x.t.u, x.t.n) : "—"}</td>
          <td>${x.benignT.n ? pct(x.benignT.u, x.benignT.n) : "—"}</td>
          <td>${x.covText}</td>
          <td><button type="button" class="pick" data-pick="a" data-key="${esc(x.a.key)}" aria-pressed="${x.a.key === state.a}" aria-label="Show ${esc(x.a.label)} as A">A</button>
              <button type="button" class="pick" data-pick="b" data-key="${esc(x.a.key)}" aria-pressed="${x.a.key === state.b}" aria-label="Show ${esc(x.a.label)} as B">B</button></td>
        </tr>`;
      })
      .join("");
    const atkLabel = atk !== null ? `attack ${esc(D.attacks[atk])}` : "each pipeline's own attacks";
    return `<details class="overview" id="overview" open>
      <summary><h2>All pipelines</h2><span class="muted">${arms.length} pipelines · ${atkLabel} · ${state.suite === "*" ? "all suites" : esc(state.suite)} · pick A and B to view or compare</span></summary>
      <div class="scroll"><table class="ov">
        <thead><tr>${th("kind", "Pipeline")}<th scope="col">Attacks</th>${th("asr", "ASR")}${th("util", "Utility under attack")}${th("benign", "Benign utility")}${th("cov", "Pairs run")}<th scope="col">Show</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </details>`;
  }

  function footerHtml() {
    return `<footer class="defs">
      <h3>How the numbers are computed</h3>
      <dl>
        <dt>Attack run</dt><dd>A result with an attack other than <code>none</code> and an injection task. DoS attacks are left out: they run on one injection task only and score security as “task failed”.</dd>
        <dt>ASR</dt><dd>Attack runs with <code>security == true</code> ÷ attack runs, over the selected cell, row, column, suite or everything. In AgentDojo result files <code>security == true</code> means the injection succeeded. Pooled rates are computed over runs, never by averaging cell rates.</dd>
        <dt>Utility under attack</dt><dd>Attack runs with <code>utility == true</code> ÷ attack runs.</dd>
        <dt>Benign utility</dt><dd>Runs with no attack that finished the user's task ÷ runs with no attack.</dd>
        <dt>Coverage</dt><dd>Pairs with at least one attack run ÷ pairs in the grid. The grid comes from the benchmark version the pipeline ran (v1–v1.1.2: 629 pairs; v1.2 and later: 949 pairs, since workspace grows from 6 to 14 injection tasks).</dd>
        <dt>Compare</dt><dd>Only pair × attack cases that both A and B ran count. A case is fixed when B's breach rate is lower than A's and regressed when it is higher. ASR and utility in Compare are over those matched cases.</dd>
        <dt>Pooled</dt><dd>A pooled entry combines the runs of several pipelines (for example the final rules of each evolving seed). Its ASR is over all their runs; the per-member figure is the mean ± sample standard deviation of each member's ASR.</dd>
      </dl>
    </footer>`;
  }

  /* ---------- detail drawer ---------- */

  const dialog = document.getElementById("detail");
  document.getElementById("detail-close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", (e) => {
    if (e.target === dialog) dialog.close();
  });

  function runHtml(run, arm) {
    const r = run.r;
    const breached = r[5] === 1;
    const member = arm.members.length > 1 ? `<span class="chip">${esc(D.pipelines[run.m].name)}</span>` : "";
    const calls = r[7].length
      ? `<ol class="trace">${r[7].map((x) => `<li>${esc(D.strings[x])}</li>`).join("")}</ol>`
      : `<span class="benign">No tool calls.</span>`;
    const dets = r[8].length
      ? `<div><div class="eyebrow">Guardrail detections</div><ul class="dets">${r[8].map((x) => `<li>${esc(D.strings[x])}</li>`).join("")}</ul></div>`
      : "";
    const err = r[6] >= 0 ? `<div class="benign">Error: ${esc(D.strings[r[6]])}</div>` : "";
    return `<div class="run ${breached ? "br" : "df"}">
      <div class="run-head"><code>${esc(D.attacks[r[3]])}</code>${member}
        <span class="pill ${breached ? "br" : "df"}">${breached ? "Attacker succeeded" : "Defended"}</span>
        <span class="pill ${r[4] ? "ok" : "fail"}">${r[4] ? "Task done" : "Task failed"}</span>
      </div>${err}${dets}
      <details><summary class="benign">${r[7].length} tool call${r[7].length === 1 ? "" : "s"}</summary>${calls}</details>
    </div>`;
  }

  function openDetail(td) {
    const table = td.closest("table");
    const suite = table.dataset.suite;
    const s = Number(table.dataset.s);
    const u = Number(td.dataset.u);
    const i = Number(td.dataset.i);
    const list = viewArms();
    const atk = attackSet(list);
    const versions = versionsOf(list);
    const utId = D.ids[suite][u];
    const itId = D.ids[suite][i];
    document.getElementById("detail-eyebrow").textContent = `${suite} · ${list.length === 2 ? "compare A → B" : "view " + state.view.toUpperCase()}`;
    document.getElementById("detail-title").textContent = `${shortId(utId)} × ${shortId(itId)}`;
    const cols = list
      .map((arm, n) => {
        const runs = runsFor(arm, s, u, i, atk).sort(
          (x, y) => D.attacks[x.r[3]].localeCompare(D.attacks[y.r[3]]) || x.m - y.m,
        );
        const benign = arm.members
          .map((m) => D.pipelines[m].benignIdx.get(s + "|" + u))
          .filter(Boolean);
        const benignText = benign.length
          ? `Without an attack, the task was finished in ${benign.reduce((x, b) => x + b[2], 0)} of ${benign.length} run${benign.length === 1 ? "" : "s"}.`
          : "No run of this task without an attack.";
        const k = runs.reduce((x, run) => x + run.r[5], 0);
        const slot = list.length === 2 ? (n === 0 ? "A" : "B") : state.view.toUpperCase();
        return `<div class="col">
          <div><div class="eyebrow">${slot} · ${esc(KIND_LABEL[arm.kind])}</div><h3>${esc(arm.label)}</h3></div>
          <p class="benign num">${runs.length ? `Attacker succeeded in ${k} of ${runs.length} run${runs.length === 1 ? "" : "s"}.` : "No attack runs for this pair."} ${benignText}</p>
          ${runs.map((run) => runHtml(run, arm)).join("")}
        </div>`;
      })
      .join("");
    document.getElementById("detail-body").innerHTML = `
      <dl class="task-text">
        <dt>Prompt</dt><dd>${esc(taskText("prompt", suite, utId, versions) || utId)}</dd>
        <dt>Goal</dt><dd>${esc(taskText("goal", suite, itId, versions) || itId)}</dd>
      </dl>
      <div class="cols">${cols}</div>`;
    dialog.classList.toggle("wide", list.length === 2);
    dialog.showModal();
    dialog.querySelector(".d-body").scrollTop = 0;
  }

  app.addEventListener("click", (e) => {
    const td = e.target.closest("td.c");
    if (td) openDetail(td);
  });
  app.addEventListener("keydown", (e) => {
    const td = e.target.closest && e.target.closest("td.c");
    if (td && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      openDetail(td);
    }
  });

  /* ---------- boot ---------- */

  function boot(data) {
    D = data;
    prepare();
    state = loadState();
    render();
    const runs = D.pipelines.reduce((n, p) => n + p.runs.length, 0);
    const guardrail = D.pipelines.some((p) => p.kind.endsWith("_guardrail"));
    document.getElementById("meta").innerHTML =
      `${D.pipelines.length} pipelines · ${runs.toLocaleString("en")} attack runs · exported ${esc(D.meta.generated.replace("T", " "))} from <code>${esc(D.meta.logdir)}</code>` +
      (guardrail ? "" : `<br><span class="notice" style="display:inline-block;margin-top:8px">This export has no static or evolving guardrail pipelines yet. Re-run the exporter after the experiment writes its results.</span>`);
  }

  function showEmpty(message) {
    app.innerHTML = `<div class="empty">
      <h2>No results loaded</h2>
      <p>${message || "This page has no data embedded. Generate it from a results directory:"}</p>
      <pre>PYTHONPATH=src python util_scripts/export_results_grid.py runs --out runs/results_grid.html</pre>
      <p>Or open a dataset written with <code>--json</code>:</p>
      <input type="file" id="file-in" accept=".json,application/json">
    </div>`;
    document.getElementById("file-in").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      file.text().then((text) => {
        try {
          boot(JSON.parse(text));
        } catch (err) {
          showEmpty(`That file isn't an exporter dataset (${esc(err.message)}). Choose the file written by <code>--json</code>.`);
        }
      });
    });
  }

  let embedded = null;
  try {
    embedded = JSON.parse(document.getElementById("grid-data").textContent);
  } catch (e) {
    embedded = null;
  }
  if (embedded) boot(embedded);
  else showEmpty();
})();
</script>
